<!doctype html>
<!--
TEMPLATE WEB: superficie z = f(x,y) in 3D (Plotly) + curve di livello in 2D collegate.
Analisi II: punti critici, gradiente, piano tangente, matrice hessiana.
Esempio: f(x,y) = x^3 - 3x + y^2  ->  punti critici (1,0) minimo, (-1,0) sella.

Cosa c'e':
  - a sinistra la superficie 3D con le curve di livello proiettate sul piano di base,
    i punti critici etichettati, il punto P=(x0,y0,f(x0,y0)) e il piano tangente in P;
  - a destra le curve di livello (Plotly contour) con P TRASCINABILE, la freccia di grad f,
    la curva di livello che passa per P e la sua tangente (tratteggiata, perpendicolare a grad f);
  - clic sulla superficie 3D = sposta P; slider x0, y0 nel pannello;
  - letture: f(P), grad f(P), det H(P), classificazione (minimo / massimo / sella / degenere / non stazionario);
  - guida (prevedi -> osserva -> spiega, guide/didattica.md): superficie, curve di livello, grad f, poi la
    DOMANDA "in (-1,0) grad f = 0: e' un minimo?" con tipi e det H nascosti (mostraTipi/nascosti), il passo
    dopo la risposta (sella); l'ultimo passo "Prova tu" (Doll.bersaglio): porta P nel minimo usando det H.

PER ADATTARE: cambia f, grad, hess (derivate scritte a mano, verificale con SymPy), il dominio
DOM, i livelli LIV e la lista CRITICI (la classificazione la calcola classifica() dalla hessiana).

Idee per esercizi simili:
  - estremi vincolati / moltiplicatori di Lagrange: aggiungi al contour la curva del vincolo
    g(x,y)=0 (traccia scatter parametrica o un secondo contour con un solo livello start=end=0);
    trascinando P sul vincolo si vede che all'estremo grad f e grad g sono paralleli
    (disegna anche la freccia di grad g, stessa funzione freccia());
    in 3D la curva sollevata (x(t), y(t), f(x(t),y(t))) con scatter3d mode "lines";
  - integrali doppi: regione D sul piano di base (scatter3d chiusa o surface piatta a z=0) e
    il "solido" sotto la superficie (surface con z mascherato a null fuori da D),
    somme di Riemann con prismi (mesh3d) e slider n;
  - stato solido: bande E(kx,ky) (es. tight-binding E = -2t(cos kx a + cos ky a)) sulla prima zona
    di Brillouin, contour = superfici di Fermi a E_F (slider), grad E = velocita' di gruppo;
  - forme quadratiche (Algebra lineare): f = x^T A x, autovettori come assi delle ellissi di livello;
  - potenziale elettrostatico V(x,y) di cariche puntiformi: E = -grad V perpendicolare alle equipotenziali.

Note tecniche:
  - Plotly non usa KaTeX: nelle etichette dei grafici scrivi testo semplice/Unicode (∇f, x₀);
  - il contour ha scaleanchor "x" -> aspetto 1:1, cosi' la perpendicolarita' si vede davvero;
  - PRESTAZIONI: un restyle del contour Plotly costa ~150 ms e uno del 3D ~30 ms (misurati). Per questo
    nel 2D Plotly disegna solo le parti fisse e cio' che segue P sta su un canvas sovrapposto
    (disegna2d, curva di livello con marching squares: < 1 ms, 60 fps); il 3D si aggiorna al massimo
    ogni MIN_3D ms durante il trascinamento. Non mettere tracce che cambiano dentro Plotly.restyle a ogni frame;
  - pixel <-> dati con _fullLayout.xaxis._offset/_length/range (interni ma stabili da anni).
Regole: titolo breve, dati in .doll-dati, didascalie <= ~12 parole, Doll.guida, Doll.pronto() alla fine.
Build:  .venv/bin/python .claude/skills/spiega/scripts/web_build.py pagina.html
Check:  .venv/bin/python .claude/skills/spiega/scripts/web_check.py interattivo.html
-->
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punti critici in 3D</title>
<!-- doll:lib plotly -->
<style>
  /* la vista contiene due grafici affiancati (in colonna su schermi stretti) */
  #vista { display: flex; }
  #g3d { flex: 1.1; min-width: 0; height: 100%; }
  #g2d { flex: 1; min-width: 0; height: 100%; position: relative; border-left: 1px solid var(--bordo); touch-action: none; }
  /* legenda su una riga, nel margine alto del grafico (margin.t = 38) */
  #g2d .doll-legenda { left: 50%; transform: translateX(-50%); top: 6px; z-index: 5; pointer-events: none; white-space: nowrap; }
  @media (max-width: 820px) {
    /* su telefono la pagina deve poter scorrere: senza questo il contenuto alto finisce sotto la didascalia */
    html, body { height: auto; }
    #vista { flex-direction: column; min-height: 720px; }
    #g3d, #g2d { flex: 1 1 0; height: auto; min-height: 360px; }
    #g2d { border-left: 0; border-top: 1px solid var(--bordo); }
  }
</style>
</head>
<body>
<header class="doll-top">
  <h1>Punti critici in 3D</h1>
  <div class="doll-dati">$f(x,y)=x^3-3x+y^2$</div>
</header>
<main class="doll-main">
  <section class="doll-vista" id="vista">
    <div id="g3d"></div>
    <div id="g2d">
      <div class="doll-legenda">
        <i style="background:#1d1d1f"></i>curva di livello per $P$ &nbsp;
        <i style="background:#c53030"></i>$\nabla f(P)$
      </div>
    </div>
  </section>
  <aside class="doll-pannello" id="pannello"></aside>
</main>
<footer class="doll-didascalia" id="didascalia"></footer>

<script>
const C = Doll.col;

/* ======================= MATEMATICA (da adattare) ======================= */
const f    = (x, y) => x ** 3 - 3 * x + y ** 2;
const grad = (x, y) => [3 * x ** 2 - 3, 2 * y];          // [f_x, f_y]
const hess = (x, y) => [[6 * x, 0], [0, 2]];              // [[f_xx, f_xy], [f_yx, f_yy]]
const DOM  = { x: [-2, 2], y: [-2, 2] };                  // dominio disegnato
const ZR   = [-3, 6];                                     // asse z (la base delle curve e' a ZR[0])
const LIV  = { start: -2, end: 6, size: 0.5 };            // livelli delle curve
// punti critici: risolti a mano (grad f = 0) e verificati con SymPy; il tipo lo calcola classifica()
const CRITICI = [[1, 0], [-1, 0]];

// classificazione col test della hessiana (2 variabili)
function classifica(x, y) {
  const [[a, b], [, d]] = hess(x, y), det = a * d - b * b;
  if (Math.abs(det) < 1e-9) return { det, tipo: "degenere" };
  if (det < 0) return { det, tipo: "sella" };
  return { det, tipo: a > 0 ? "minimo" : "massimo" };
}

/* ======================= DATI DELLE SUPERFICI ======================= */
const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
const X = linspace(DOM.x[0], DOM.x[1], 81), Y = linspace(DOM.y[0], DOM.y[1], 81);
const Z = Y.map(y => X.map(x => f(x, y)));                // Plotly: Z[riga=j (y)][colonna=i (x)]

// scala colori sobria, coerente con la palette Doll (blu basso -> sabbia -> arancio alto)
const SCALA = [[0, "#1e3a5f"], [0.25, "#2b6cb0"], [0.5, "#8fbbe0"], [0.75, "#f3dcae"], [1, "#dd6b20"]];
const zmin = LIV.start, zmax = LIV.end;
const crit = CRITICI.map(([x, y]) => ({ x, y, z: f(x, y), ...classifica(x, y) }));
const FONT = { family: "-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif", size: 13, color: C.testo };

/* ---------- stato: il punto P ---------- */
let P = { x: 0.4, y: 1.2 };
const H_PIANO = 0.5;                                      // semilato del piano tangente disegnato

function pianoTangente(x0, y0) {
  const z0 = f(x0, y0), [gx, gy] = grad(x0, y0), h = H_PIANO;
  const xs = [x0 - h, x0 + h], ys = [y0 - h, y0 + h];
  return { x: xs, y: ys, z: ys.map(y => xs.map(x => z0 + gx * (x - x0) + gy * (y - y0))) };
}

/* ======================= GRAFICO 3D ======================= */
const g3d = document.getElementById("g3d");
const ax3 = (titolo, range) => ({ title: { text: titolo }, range, autorange: false, showspikes: false,
  gridcolor: "#e6e4dc", zerolinecolor: "#c9c6bb", backgroundcolor: "#fbfaf7", showbackground: true, tickfont: { size: 11 } });

const tracce3d = [
  { // 0: la superficie, con le curve di livello proiettate sulla base (project.z)
    type: "surface", x: X, y: Y, z: Z, colorscale: SCALA, cmin: zmin, cmax: zmax, showscale: false,
    opacity: 0.95, hovertemplate: "x=%{x:.2f}<br>y=%{y:.2f}<br>f=%{z:.2f}<extra></extra>",
    lighting: { ambient: 0.75, diffuse: 0.6, specular: 0.05, roughness: 0.9 },
    contours: { z: { show: true, usecolormap: true, start: LIV.start, end: LIV.end, size: LIV.size,
                     project: { z: true }, width: 2 }, x: { highlight: false }, y: { highlight: false } }
  },
  { // 1: piano tangente in P
    type: "surface", ...pianoTangente(P.x, P.y), showscale: false, opacity: 0.55, hoverinfo: "skip",
    colorscale: [[0, C.arancio], [1, C.arancio]], cmin: 0, cmax: 1, surfacecolor: [[0, 0], [0, 0]],
    contours: { x: { highlight: false }, y: { highlight: false }, z: { highlight: false } }
  },
  { // 2: punto P sulla superficie
    type: "scatter3d", mode: "markers+text", x: [P.x], y: [P.y], z: [f(P.x, P.y)], text: ["P"],
    textposition: "top right", textfont: { size: 15, color: C.testo }, hoverinfo: "skip",
    marker: { size: 6, color: C.testo, line: { color: "#fff", width: 1 } }
  },
  { // 3: proiezione di P sulla base (asta verticale tratteggiata)
    type: "scatter3d", mode: "lines+markers", x: [P.x, P.x], y: [P.y, P.y], z: [ZR[0], f(P.x, P.y)],
    line: { color: C.testo, width: 3, dash: "dash" }, marker: { size: [4, 0], color: C.testo }, hoverinfo: "skip"
  },
  { // 4: punti critici (le etichette sono scene.annotations, disegnate sempre in primo piano)
    type: "scatter3d", mode: "markers", x: crit.map(c => c.x), y: crit.map(c => c.y), z: crit.map(c => c.z + 0.08),
    hoverinfo: "skip",
    marker: { size: 6, color: crit.map(c => coloreTipo(c.tipo)), line: { color: "#fff", width: 1 } }
  },
  { // 5: sezioni della superficie per P lungo x e lungo y (curvature f_xx e f_yy), accese con "sezioni"
    type: "scatter3d", mode: "lines", ...sezioni(P.x, P.y), connectgaps: false, hoverinfo: "skip",
    line: { color: C.testo, width: 5 }, visible: false
  }
];
// le due curve z = f(x, y0) e z = f(x0, y), separate da null (Plotly interrompe la linea)
function sezioni(x0, y0) {
  const xs = linspace(DOM.x[0], DOM.x[1], 60), ys = linspace(DOM.y[0], DOM.y[1], 60), su = 0.03;
  return { x: [...xs, null, ...ys.map(() => x0)], y: [...xs.map(() => y0), null, ...ys],
           z: [...xs.map(x => f(x, y0) + su), null, ...ys.map(y => f(x0, y) + su)] };
}
// P "coincide" con un punto critico: nascondiamo l'etichetta P per non sovrapporla
const suCritico = () => crit.some(c => Math.hypot(c.x - P.x, c.y - P.y) < 0.12);
function coloreTipo(t) { return { minimo: C.verde, massimo: C.rosso, sella: C.viola }[t] || C.grigio; }

const CAMERE = {
  standard: { eye: { x: 1.55, y: -1.55, z: 0.95 }, center: { x: 0, y: 0, z: -0.12 } },
  alto:     { eye: { x: 0.9, y: -1.5, z: 1.9 }, center: { x: 0, y: 0, z: -0.2 } },    // dall'alto: le curve proiettate
  sella:    { eye: { x: -1.6, y: -1.7, z: 0.8 }, center: { x: -0.15, y: 0, z: -0.1 } },
  minimo:   { eye: { x: 1.9, y: -1.25, z: 0.85 }, center: { x: 0.2, y: 0, z: -0.15 } }
};
// etichette dei punti critici (funzioni: la guida puo' nasconderle e rimetterle)
const annot3d = () => crit.map(c => ({ x: c.x, y: c.y, z: c.z, text: c.tipo, showarrow: false, yshift: 16,
  font: { size: 14, color: coloreTipo(c.tipo) }, bgcolor: "rgba(255,255,255,.75)", borderpad: 2 }));
const annot2d = () => crit.map(c => ({ x: c.x, y: c.y, text: c.tipo, showarrow: false, yshift: -16,
  font: { size: 13, color: coloreTipo(c.tipo) }, bgcolor: "rgba(255,255,255,.8)", borderpad: 2 }));
const layout3d = {
  margin: { l: 0, r: 0, t: 0, b: 0 }, paper_bgcolor: "#fff", font: FONT, showlegend: false,
  scene: {
    xaxis: ax3("x", DOM.x), yaxis: ax3("y", DOM.y), zaxis: ax3("z", ZR),
    aspectmode: "manual", aspectratio: { x: 1, y: 1, z: 0.8 }, camera: CAMERE.standard, dragmode: "orbit",
    annotations: annot3d()
  }
};

/* ======================= GRAFICO 2D (curve di livello) ======================= */
// Plotly disegna solo la parte FISSA (curve colorate, punti critici). La parte che segue P (curva di
// livello per P, grad f, tangente, angolo retto, P) e' su un canvas sovrapposto: ridisegnarla costa
// < 1 ms, mentre un restyle del contour di Plotly costa ~150 ms (niente 60 fps).
const g2d = document.getElementById("g2d");
const ax2 = (titolo, range) => ({ title: { text: titolo, standoff: 4 }, range, autorange: false, fixedrange: true,
  zeroline: false, showgrid: false, ticks: "outside", ticklen: 4, mirror: true, showline: true, linecolor: "#9a978d" });
const tracce2d = [
  { // 0: curve di livello colorate (stessi livelli e colori del 3D)
    type: "contour", x: X, y: Y, z: Z, colorscale: SCALA, zmin, zmax, showscale: false, hoverinfo: "skip",
    contours: { start: LIV.start, end: LIV.end, size: LIV.size, coloring: "heatmap", showlabels: true,
                labelfont: { size: 10, color: "#3a3a3a" } },
    line: { width: 1, color: "rgba(40,40,40,.45)" }, opacity: 0.8
  },
  { // 1: punti critici
    type: "scatter", mode: "markers", x: crit.map(c => c.x), y: crit.map(c => c.y), hoverinfo: "skip",
    marker: { size: 10, color: crit.map(c => coloreTipo(c.tipo)), line: { color: "#fff", width: 1.5 } }
  }
];
const layout2d = {
  margin: { l: 44, r: 12, t: 38, b: 40 }, paper_bgcolor: "#fff", plot_bgcolor: "#fff", font: FONT,
  showlegend: false, dragmode: false, hovermode: false,
  // constrain "domain": per avere 1:1 Plotly restringe l'area del grafico invece di allargare gli assi
  // (1:1 serve: altrimenti grad f non sembrerebbe perpendicolare alle curve di livello)
  xaxis: { ...ax2("x", DOM.x), constrain: "domain" },
  yaxis: { ...ax2("y", DOM.y), scaleanchor: "x", scaleratio: 1, constrain: "domain" },
  annotations: annot2d()
};

const CONFIG = { displayModeBar: false, responsive: true };
Plotly.newPlot(g3d, tracce3d, layout3d, CONFIG);
Plotly.newPlot(g2d, tracce2d, layout2d, CONFIG);

/* ---------- canvas sovrapposto al contour ---------- */
const sovra = document.createElement("canvas");
Object.assign(sovra.style, { position: "absolute", left: 0, top: 0, pointerEvents: "none", zIndex: 4 });
g2d.appendChild(sovra);
const cx = sovra.getContext("2d");
function adattaSovra() {
  const dpr = window.devicePixelRatio || 1, w = g2d.clientWidth, h = g2d.clientHeight;
  sovra.width = w * dpr; sovra.height = h * dpr; sovra.style.width = w + "px"; sovra.style.height = h + "px";
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); disegna2d();
}
// dati -> pixel del grafico 2D (assi calcolati da Plotly; _offset/_length sono interni ma stabili)
function mappa() {
  const xa = g2d._fullLayout.xaxis, ya = g2d._fullLayout.yaxis;
  return { X: x => xa._offset + (x - xa.range[0]) / (xa.range[1] - xa.range[0]) * xa._length,
           Y: y => ya._offset + (ya.range[1] - y) / (ya.range[1] - ya.range[0]) * ya._length,
           x0: xa._offset, y0: ya._offset, w: xa._length, h: ya._length, kx: xa._length / (xa.range[1] - xa.range[0]) };
}
// curva di livello f = c con marching squares su una griglia fine (segmenti sciolti, basta per disegnare)
const XF = linspace(DOM.x[0], DOM.x[1], 161), YF = linspace(DOM.y[0], DOM.y[1], 161);
const ZF = YF.map(y => XF.map(x => f(x, y)));
function segmentiLivello(c) {
  const seg = [], n = XF.length - 1, m = YF.length - 1;
  const su = (xa, ya, za, xb, yb, zb) => { const t = (c - za) / (zb - za); return [xa + t * (xb - xa), ya + t * (yb - ya)]; };
  for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) {
    const x0 = XF[i], x1 = XF[i + 1], y0 = YF[j], y1 = YF[j + 1];
    const a = ZF[j][i], b = ZF[j][i + 1], d = ZF[j + 1][i + 1], e = ZF[j + 1][i];   // (x0,y0) (x1,y0) (x1,y1) (x0,y1)
    const pt = [], sopra = z => z >= c;
    if (sopra(a) !== sopra(b)) pt.push(su(x0, y0, a, x1, y0, b));
    if (sopra(b) !== sopra(d)) pt.push(su(x1, y0, b, x1, y1, d));
    if (sopra(d) !== sopra(e)) pt.push(su(x1, y1, d, x0, y1, e));
    if (sopra(e) !== sopra(a)) pt.push(su(x0, y1, e, x0, y0, a));
    if (pt.length >= 2) seg.push([pt[0], pt[1]]);
    if (pt.length === 4) seg.push([pt[2], pt[3]]);
  }
  return seg;
}
// lunghezza della freccia di grad f: proporzionale a |grad f| (SCALA_G), al massimo L_MAX, punta dentro il dominio
const SCALA_G = 0.22, L_MAX = 1.1;
function lunghezzaFreccia(x0, y0, v) {
  const n = Math.hypot(v[0], v[1]); let L = Math.min(SCALA_G * n, L_MAX);
  for (const [k, lim] of [[0, DOM.x], [1, DOM.y]]) {
    const u = v[k] / n, p0 = k ? y0 : x0;
    if (u > 1e-9) L = Math.min(L, (lim[1] - p0) / u);
    if (u < -1e-9) L = Math.min(L, (lim[0] - p0) / u);
  }
  return L;
}
function disegna2d() {
  const w = g2d.clientWidth, h = g2d.clientHeight; cx.clearRect(0, 0, w, h);
  if (!g2d._fullLayout || !g2d._fullLayout.xaxis._length) return;
  const M = mappa(), { x, y } = P, z = f(x, y), g = grad(x, y), n = Math.hypot(g[0], g[1]);
  const px = M.X(x), py = M.Y(y);
  cx.save(); cx.beginPath(); cx.rect(M.x0, M.y0, M.w, M.h); cx.clip();
  // curva di livello per P
  cx.strokeStyle = C.testo; cx.lineWidth = 3; cx.lineCap = "round"; cx.beginPath();
  for (const [[ax, ay], [bx, by]] of segmentiLivello(z)) { cx.moveTo(M.X(ax), M.Y(ay)); cx.lineTo(M.X(bx), M.Y(by)); }
  cx.stroke();
  if (n > 1e-9) {
    const ux = g[0] / n, uy = g[1] / n;                   // direzione di grad f (dati); in pixel la y e' invertita
    // tangente alla curva di livello (tratteggiata)
    cx.setLineDash([6, 5]); cx.strokeStyle = C.grigio; cx.lineWidth = 2; cx.beginPath();
    cx.moveTo(px + uy * 0.45 * M.kx, py + ux * 0.45 * M.kx); cx.lineTo(px - uy * 0.45 * M.kx, py - ux * 0.45 * M.kx); cx.stroke();
    cx.setLineDash([]);
    // angolo retto
    const s = 0.11 * M.kx, tx = -uy, ty = ux;             // t = tangente (dati)
    cx.strokeStyle = C.rosso; cx.lineWidth = 1.5; cx.beginPath();
    cx.moveTo(px + s * tx, py - s * ty); cx.lineTo(px + s * (tx + ux), py - s * (ty + uy)); cx.lineTo(px + s * ux, py - s * uy); cx.stroke();
    // freccia di grad f
    const L = lunghezzaFreccia(x, y, g) * M.kx, qx = px + ux * L, qy = py - uy * L, pt = 11;
    cx.strokeStyle = cx.fillStyle = C.rosso; cx.lineWidth = 3; cx.beginPath();
    cx.moveTo(px, py); cx.lineTo(qx - ux * pt * 0.7, qy + uy * pt * 0.7); cx.stroke();
    cx.beginPath(); cx.moveTo(qx, qy); cx.lineTo(qx - ux * pt + uy * pt * 0.45, qy + uy * pt + ux * pt * 0.45);
    cx.lineTo(qx - ux * pt - uy * pt * 0.45, qy + uy * pt - ux * pt * 0.45); cx.closePath(); cx.fill();
    cx.restore(); cx.save();                               // le etichette possono uscire dal riquadro
    cx.font = "15px -apple-system, Helvetica, Arial, sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillStyle = C.rosso; cx.fillText("∇f", qx + ux * 14 + uy * 10, qy - uy * 14 + ux * 10);
  }
  // P (con l'etichetta dal lato opposto a grad f)
  // su un punto critico P diventa un anello, cosi' resta visibile il marcatore colorato del punto critico
  if (suCritico()) { cx.strokeStyle = C.arancio; cx.lineWidth = 3; cx.beginPath(); cx.arc(px, py, 9, 0, 2 * Math.PI); cx.stroke(); }
  else { cx.fillStyle = C.arancio; cx.strokeStyle = "#fff"; cx.lineWidth = 2;
         cx.beginPath(); cx.arc(px, py, 6.5, 0, 2 * Math.PI); cx.fill(); cx.stroke(); }
  if (!suCritico()) {
    const ux = n > 1e-9 ? g[0] / n : 0.7, uy = n > 1e-9 ? g[1] / n : -0.7;
    cx.font = "15px -apple-system, Helvetica, Arial, sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillStyle = C.testo; cx.fillText("P", px - ux * 16, py + uy * 16);
  }
  cx.restore();
}
new ResizeObserver(adattaSovra).observe(g2d);
g2d.on("plotly_afterplot", disegna2d);                     // dopo ogni ridisegno di Plotly (es. resize)

/* ======================= AGGIORNAMENTO ======================= */
// 2D e letture: al piu' una volta per frame. 3D: un restyle di gl3d costa ~30 ms anche su GPU,
// quindi durante il trascinamento lo aggiorniamo al massimo ogni MIN_3D ms (e sempre alla fine).
const MIN_3D = 70;
let richiesto = false, ultimo3d = 0, timer3d = null;
function sposta(x, y) {
  P.x = Math.min(DOM.x[1], Math.max(DOM.x[0], x));
  P.y = Math.min(DOM.y[1], Math.max(DOM.y[0], y));
  if (!richiesto) { richiesto = true; requestAnimationFrame(ridisegna); }
}
function ridisegna() {
  richiesto = false;
  disegna2d(); sX.set0(P.x); sY.set0(P.y); letture();
  const attesa = MIN_3D - (performance.now() - ultimo3d);
  clearTimeout(timer3d);
  if (attesa <= 0) aggiorna3d(); else timer3d = setTimeout(aggiorna3d, attesa);
}
function aggiorna3d() {
  ultimo3d = performance.now();
  const { x, y } = P, z = f(x, y), pt = pianoTangente(x, y), se = sezioni(x, y);
  // restyle con array: l'i-esimo elemento va alla i-esima traccia dell'elenco [1, 2, 3, 5]
  Plotly.restyle(g3d, { x: [pt.x, [x], [x, x], se.x], y: [pt.y, [y], [y, y], se.y], z: [pt.z, [z], [ZR[0], z], se.z],
                        text: [null, [suCritico() ? "" : "P"], null, null] }, [1, 2, 3, 5]);
}

/* ---------- trascinamento di P sul grafico delle curve di livello ---------- */
function pixelADati(ev) {
  const fl = g2d._fullLayout, xa = fl.xaxis, ya = fl.yaxis, r = g2d.getBoundingClientRect();
  const px = ev.clientX - r.left - xa._offset, py = ev.clientY - r.top - ya._offset;
  return { x: xa.range[0] + (xa.range[1] - xa.range[0]) * px / xa._length,
           y: ya.range[1] - (ya.range[1] - ya.range[0]) * py / ya._length };
}
let trascino = false;
g2d.addEventListener("pointerdown", ev => {
  const d = pixelADati(ev);
  if (d.x < DOM.x[0] || d.x > DOM.x[1] || d.y < DOM.y[0] || d.y > DOM.y[1]) return;
  trascino = true; g2d.setPointerCapture(ev.pointerId); sposta(d.x, d.y); ev.preventDefault();
}, true);
g2d.addEventListener("pointermove", ev => { if (trascino) { const d = pixelADati(ev); sposta(d.x, d.y); } }, true);
g2d.addEventListener("pointerup", () => { trascino = false; }, true);
// clic sulla superficie 3D: sposta P li' (ruotare trascinando non conta come clic)
g3d.on("plotly_click", ev => { const p = ev.points && ev.points[0]; if (p && p.curveNumber === 0) sposta(p.x, p.y); });

window.addEventListener("resize", () => { Plotly.Plots.resize(g3d); Plotly.Plots.resize(g2d); });

/* ======================= PANNELLO ======================= */
const fmt = v => (Math.abs(v) < 5e-3 ? 0 : v).toFixed(2).replace(".", ",");
const num = v => (Math.abs(v) < 5e-3 ? 0 : v).toFixed(2).replace(".", "{,}");     // per il TeX
Doll.titoletto(null, "Punto P");
// slider "muti": set0 aggiorna solo la posizione dello slider, senza richiamare sposta()
function sliderMuto(o) {
  let muto = false;
  const s = Doll.slider(null, { ...o, fmt, onInput: v => { if (!muto) o.cambia(v); } });
  s.set0 = v => { muto = true; s.set(v); muto = false; };
  return s;
}
const sX = sliderMuto({ label: "$x_0$", min: DOM.x[0], max: DOM.x[1], step: 0.05, value: P.x, cambia: v => sposta(v, P.y) });
const sY = sliderMuto({ label: "$y_0$", min: DOM.y[0], max: DOM.y[1], step: 0.05, value: P.y, cambia: v => sposta(P.x, v) });
const sSez = Doll.scelta(null, { label: "sezioni per $P$ lungo $x$ e $y$", value: "no",
  opzioni: [["no", "nascoste"], ["si", "visibili"]], onChange: v => Plotly.restyle(g3d, { visible: v === "si" }, [5]) });
const nota = document.createElement("p"); nota.className = "doll-nota";
nota.textContent = "Trascina il punto arancione sulle curve di livello, o clicca sulla superficie.";
document.getElementById("pannello").appendChild(nota);

Doll.titoletto(null, "Letture in P");
const lF = Doll.lettura(null, "$f(P)$");
const lG = Doll.lettura(null, "$\\nabla f(P)$");
const lD = Doll.lettura(null, "$\\det H(P)$");
const lC = Doll.lettura(null, "tipo di punto");
// letture nascoste ("?") nei passi della guida che pongono una domanda (vedi PERCORSO GUIDATO)
const nascosti = { tipo: false, det: false };
function letture() {
  const { x, y } = P, g = grad(x, y), c = classifica(x, y), stazionario = Math.hypot(g[0], g[1]) < 1e-6;
  lF(`$${num(f(x, y))}$`);
  lG(`$(${num(g[0])},\\ ${num(g[1])})$`);
  lD(nascosti.det ? "?" : `$${num(c.det)}$`);
  lC(nascosti.tipo ? "?" : stazionario ? `<span style="color:${coloreTipo(c.tipo)}">${c.tipo}</span>`
                 : `<span style="color:${C.grigio}">non stazionario</span>`);
}
letture();

/* ======================= PERCORSO GUIDATO ======================= */
// "Prova tu": portare P nel minimo. SymPy: grad f = 0 in (1,0) e (-1,0); H(1,0) = diag(6,2), det H = 12 > 0,
// f_xx = 6 > 0 -> minimo, f(1,0) = -2; H(-1,0): det H = -12 < 0 -> sella. Tolleranza: |P - (1,0)| < 0,08
// (gli slider hanno passo 0,05 e arrivano esattamente a (1, 0); trascinando sono ~10 px).
const prova = Doll.bersaglio(null, { testo: "Porta $P$ nel punto con $\\nabla f=0$ e $\\det H\\gt 0$",
  verifica: () => Math.hypot(P.x - 1, P.y) < 0.08,
  ok: "Minimo in $(1,0)$: $\\det H=12\\gt 0$, $f_{xx}=6\\gt 0$, $f=-2$" });
// tipi visibili o no: etichette "minimo/sella" e colori dei punti critici (grigi quando nascosti)
function mostraTipi(v) {
  const colori = crit.map(c => (v ? coloreTipo(c.tipo) : C.grigio));
  Plotly.relayout(g3d, { "scene.annotations": v ? annot3d() : [] });
  Plotly.relayout(g2d, { annotations: v ? annot2d() : [] });
  Plotly.restyle(g3d, { "marker.color": [colori] }, [4]);
  Plotly.restyle(g2d, { "marker.color": [colori] }, [1]);
}
// superficie semitrasparente nel passo delle curve di livello, cosi' si vedono le proiezioni sulla base;
// domanda: tipo e det H nascosti; prova: tipo nascosto (si usa det H) e bersaglio visibile
const vai = (x, y, cam, { opacita = 0.95, sez = "no", domanda = false, conProva = false } = {}) => {
  nascosti.tipo = domanda || conProva; nascosti.det = domanda;
  mostraTipi(!nascosti.tipo);
  sposta(x, y); sSez.set(sez); letture();
  Plotly.restyle(g3d, { opacity: opacita }, [0]);
  if (cam) Plotly.relayout(g3d, { "scene.camera": CAMERE[cam] });
  prova.mostra(conProva);
};
Doll.guida([
  { testo: "La superficie $z=f(x,y)$: una valle e un passo",          applica: () => vai(0.4, 1.2, "standard") },
  { testo: "Curve di livello $f=c$: la superficie vista dall'alto",      applica: () => vai(0.5, -0.9, "alto", { opacita: 0.45 }) },
  { testo: "$\\nabla f$ è perpendicolare alla curva di livello",        applica: () => vai(0.2, 1.3, "standard") },
  { testo: "In $(-1,0)$ è $\\nabla f=0$: è un minimo? Prevedi, poi Avanti",
    applica: () => vai(-1, 0, "alto", { domanda: true }) },
  { testo: "No: sella, $\\det H\\lt 0$, piano tangente orizzontale",  applica: () => vai(-1, 0, "sella", { sez: "si" }) },
  { testo: "Prova tu: porta $P$ nel minimo usando $\\det H$",           applica: () => vai(-0.5, 1, "standard", { conProva: true }) },
]);
Doll.pronto();
</script>
