<!doctype html>
<!--
TEMPLATE WEB: statistica e misure (Plotly). Laboratorio di fisica, Misure elettroniche,
Fisica nucleare, Probabilita' e statistica: "che cosa succede alla distribuzione quando
aumento i campioni / le misure / il rumore".
Quattro esperimenti nella stessa pagina (select "Esperimento"), ognuno e' un blocco MODO_*:
  (a) MODO_TLC          teorema del limite centrale: istogramma delle medie di n campioni
                        (dado, uniforme, esponenziale) + gaussiana N(mu, sigma^2/n) scalata ai conteggi;
  (b) MODO_MISURA       misure ripetute di g con rumore gaussiano: istogramma, media +- s/sqrt(N),
                        media progressiva con banda dell'errore che si stringe;
  (c) MODO_FIT          minimi quadrati s = v t + s0 con barre d'errore, residui, chi^2/ndf
                        (e cosa succede se le barre sono sotto/sovrastimate);
  (d) MODO_DECADIMENTO  Monte Carlo: ogni nucleo decade con probabilita' p = lambda*Dt per passo;
                        N(t) contro N0 e^(-lambda t), t_1/2 teorico e stimato, conteggi con errore sqrt(n).
Per un esercizio specifico tieni SOLO il modo che serve: cancella gli altri blocchi MODO_*,
la select "Esperimento" e i passi di guida che li usano.
Guida (prevedi -> osserva -> spiega, guide/didattica.md): TLC; la DOMANDA "da 10 a 1000 misure: cosa si
stringe?" (stato con N = 10), il passo dopo la risposta (N = 1000: s resta, s/sqrt(N) cala); fit;
decadimento; l'ultimo passo "Prova tu" (Doll.bersaglio, visibile solo li'): dimezzare la larghezza
delle medie di n = 4 dadi (risposta n = 16).

Idee simili:
  propagazione delle incertezze (Monte Carlo di f(x, y) con x, y gaussiani, confronto con la formula
  delle derivate parziali); t di Student (media di N piccolo: intervallo +- t*s/sqrt(N) che contiene
  il valore vero nel 95% dei casi, ripetendo l'esperimento); test del chi^2 (istogramma di molti
  chi^2 simulati contro la distribuzione chi^2_ndf, p-value); conteggi di Poisson contro gaussiana
  (media bassa: asimmetria; media alta: gaussiana); media pesata di misure con incertezze diverse;
  esperienze di laboratorio: pendolo (T^2 contro l), legge di Ohm (V contro I), molla (F contro x),
  caduta libera (s contro t^2), carica/scarica RC (ln V contro t); fondo + segnale in uno spettro.

Note tecniche:
  - numeri casuali con seme (generatore(seme): mulberry32 + Box-Muller) -> stati riproducibili
    per il controllo automatico; i bottoni "+100", "Nuovi dati", "Esegui" proseguono la sequenza.
  - Plotly.react a ogni aggiornamento (veloce, non ricrea il grafico), displayModeBar spento,
    separatore decimale "," (layout.separators), responsive + Plotly.Plots.resize al resize.
  - Le scritte dentro Plotly sono testo/HTML semplice (x̄, σ, <sub>, <sup>), NON KaTeX.
Regole: titolo breve, dati in .doll-dati, didascalie <= ~12 parole, Doll.guida per il percorso
guidato (ogni passo = uno stato fotografato dal controllo), Doll.pronto() alla fine.
Build:  .venv/bin/python .claude/skills/spiega/scripts/web_build.py pagina.html
Check:  .venv/bin/python .claude/skills/spiega/scripts/web_check.py interattivo.html
-->
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistica e misure</title>
<!-- doll:lib plotly -->
<style>
  #grafico { position: absolute; inset: 0; }
  .sezione { display: flex; flex-direction: column; gap: 14px; }
  .sezione[hidden] { display: none; }
  .doll-risultato { font-size: 15px; text-align: center; }
  /* doll.css rende in grassetto ogni span:last-child dentro .doll-lettura, anche dentro le formule
     KaTeX dell'etichetta: qui l'etichetta torna di peso normale */
  .doll-lettura > span:first-child span { font-weight: inherit; }
  /* due sottografici: su schermo stretto serve piu' altezza */
  @media (max-width: 820px) { .doll-vista { min-height: 480px; } }
</style>
</head>
<body>
<header class="doll-top">
  <h1 id="titolo">Limite centrale</h1>
  <div class="doll-dati" id="dati"></div>
</header>
<main class="doll-main">
  <section class="doll-vista" id="vista">
    <div id="grafico"></div>
  </section>
  <aside class="doll-pannello" id="pannello"></aside>
</main>
<footer class="doll-didascalia" id="didascalia"></footer>

<script>
const C = Doll.col;
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
const grafico = document.getElementById("grafico");
const pannello = document.getElementById("pannello");

/* ================= helper generici ================= */

// Numeri casuali riproducibili: mulberry32 (uniforme in [0,1)) + Box-Muller (normale standard).
function generatore(seme) {
  let a = seme >>> 0, riserva = null;
  const u = () => {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const n = () => {
    if (riserva !== null) { const z = riserva; riserva = null; return z; }
    let u1 = u(); while (u1 < 1e-12) u1 = u();
    const r = Math.sqrt(-2 * Math.log(u1)), th = 2 * Math.PI * u();
    riserva = r * Math.sin(th); return r * Math.cos(th);
  };
  return { u, n };
}

// numeri all'italiana: virgola decimale, segno meno tipografico
const num = (x, d) => (Number.isFinite(x) ? x.toFixed(d).replace(".", ",").replace("-", "−") : "—");
// "valore ± incertezza" con l'incertezza a 2 cifre significative e il valore alla stessa cifra
function conIncertezza(x, s, unita = "") {
  if (!Number.isFinite(s) || s <= 0) return num(x, 3) + (unita ? " " + unita : "");
  const d = Math.max(0, 1 - Math.floor(Math.log10(s)));
  return `${num(x, d)} ± ${num(s, d)}` + (unita ? " " + unita : "");
}
const media = a => a.reduce((s, v) => s + v, 0) / a.length;
function devStd(a) {           // deviazione standard campionaria (divide per N-1)
  if (a.length < 2) return NaN;
  const m = media(a); let s = 0; for (const v of a) s += (v - m) ** 2;
  return Math.sqrt(s / (a.length - 1));
}
const gauss = (x, mu, s) => Math.exp(-0.5 * ((x - mu) / s) ** 2) / (s * Math.sqrt(2 * Math.PI));
// istogramma: nb classi uguali su [lo, hi]; i valori fuori intervallo sono scartati
function istogramma(valori, lo, hi, nb) {
  const w = (hi - lo) / nb, y = new Array(nb).fill(0);
  for (const v of valori) { const k = Math.floor((v - lo) / w + 1e-9); if (k >= 0 && k < nb) y[k]++; }
  return { x: y.map((_, k) => lo + (k + 0.5) * w), y, w };
}
const linspace = (a, b, n) => Array.from({ length: n }, (_, k) => a + (b - a) * k / (n - 1));

// ---- Plotly: stile comune ----
function layoutBase(extra) {
  return Object.assign({
    font: { family: FONT, size: 13, color: C.testo },
    paper_bgcolor: "#ffffff", plot_bgcolor: "#ffffff",
    margin: { l: 70, r: 24, t: 46, b: 56 },
    separators: ",.",                       // virgola decimale
    showlegend: true,
    legend: { orientation: "h", x: 0, y: 1.01, xanchor: "left", yanchor: "bottom", font: { size: 12.5 }, traceorder: "normal" },
    hovermode: "closest", dragmode: false,  // niente zoom accidentali durante la lezione
    hoverlabel: { font: { family: FONT } },
  }, extra);
}
const asse = (titolo, extra) => Object.assign({
  title: { text: titolo, standoff: 10 }, gridcolor: "#eeece6", zerolinecolor: "#d6d3ca",
  linecolor: "#bbbbbb", ticks: "outside", tickcolor: "#bbbbbb", automargin: true,
}, extra);
const lineaV = (x, colore, dash = "dash", asseY = "y") => ({ type: "line", xref: asseY === "y" ? "x" : "x2",
  yref: asseY + " domain", x0: x, x1: x, y0: 0, y1: 1, line: { color: colore, width: 2, dash } });
const lineaH = (y, colore, dash = "dash", asseX = "x", asseY = "y") => ({ type: "line", xref: asseX + " domain",
  yref: asseY, x0: 0, x1: 1, y0: y, y1: y, line: { color: colore, width: 1.6, dash } });
function disegna(tracce, layout) {
  Plotly.react(grafico, tracce, layout, { displayModeBar: false, responsive: true });
}
window.addEventListener("resize", () => Plotly.Plots.resize(grafico));

// sezioni del pannello (una per modo, mostrata solo quella attiva)
function sezione() { const d = document.createElement("div"); d.className = "sezione"; d.hidden = true; pannello.appendChild(d); return d; }
function nota(parent, testo) { const p = document.createElement("p"); p.className = "doll-nota"; p.style.margin = "0"; p.innerHTML = testo; parent.appendChild(p); Doll.tex(p); return p; }

/* ================= pannello: scelta dell'esperimento ================= */
Doll.titoletto(null, "Esperimento");
const sModo = Doll.scelta(null, { opzioni: [["tlc", "Limite centrale"], ["misura", "Misure ripetute"],
  ["fit", "Fit lineare"], ["decadimento", "Decadimento radioattivo"]], value: "tlc", onChange: v => attiva(v) });
const MODI = {};

/* ================= MODO_TLC: teorema del limite centrale ================= */
MODI.tlc = (() => {
  const DIST = {
    dado:         { mu: 3.5, sigma: Math.sqrt(35 / 12), estrai: r => 1 + Math.floor(6 * r.u()), lo: 1, hi: 6, discreta: true },
    uniforme:     { mu: 0.5, sigma: Math.sqrt(1 / 12),  estrai: r => r.u(), lo: 0, hi: 1 },
    esponenziale: { mu: 1,   sigma: 1,                  estrai: r => -Math.log(1 - r.u()), lo: 0, hi: 4 },
  };
  let dist = "dado", n = 1, medie = [], rng = generatore(1);
  const sez = sezione();
  Doll.titoletto(sez, "Parametri");
  const sDist = Doll.scelta(sez, { label: "distribuzione di partenza", value: dist,
    opzioni: [["dado", "dado a 6 facce"], ["uniforme", "uniforme su [0, 1]"], ["esponenziale", "esponenziale, λ = 1"]],
    onChange: v => { dist = v; rigenera(); } });
  const sN = Doll.slider(sez, { label: "campioni per media $n$", min: 1, max: 30, step: 1, value: n,
    onInput: v => { n = v; rigenera(); } });
  Doll.bottone(sez, "+100 medie", () => aggiungi(100));
  Doll.bottone(sez, "+1000 medie", () => aggiungi(1000), true);
  Doll.bottone(sez, "Azzera", () => { medie = []; rng = generatore(1); aggiorna(); });
  Doll.titoletto(sez, "Letture");
  const lM = Doll.lettura(sez, "medie raccolte");
  const lMu = Doll.lettura(sez, "$\\mu$ (teorica)");
  const lMm = Doll.lettura(sez, "media delle medie");
  const lSt = Doll.lettura(sez, "$\\sigma/\\sqrt{n}$ (teorica)");
  const lSm = Doll.lettura(sez, "dev. std delle medie");
  nota(sez, "La larghezza scende come $1/\\sqrt{n}$, la forma diventa gaussiana per qualunque distribuzione di partenza.");

  function aggiungi(k) {
    const D = DIST[dist];
    for (let i = 0; i < k; i++) { let s = 0; for (let j = 0; j < n; j++) s += D.estrai(rng); medie.push(s / n); }
    aggiorna();
  }
  // cambiando n o la distribuzione le medie vecchie non valgono piu': stesso numero, stesso seme
  function rigenera() { const M = medie.length || 2000; medie = []; rng = generatore(1); aggiungi(M); }

  function aggiorna() {
    const D = DIST[dist], M = medie.length, st = D.sigma / Math.sqrt(n);
    // dado: la media vale k/n -> classi larghe 1/n centrate sui valori possibili (niente aliasing)
    const h = D.discreta ? istogramma(medie, 1 - 0.5 / n, 6 + 0.5 / n, 5 * n + 1) : istogramma(medie, D.lo, D.hi, 60);
    const xlo = D.discreta ? 0.5 : D.lo, xhi = D.discreta ? 6.5 : D.hi;
    const xg = linspace(xlo, xhi, 400);
    disegna([
      { type: "bar", x: h.x, y: h.y, width: h.w * (D.discreta ? 0.85 : 0.96), name: "istogramma delle medie",
        marker: { color: C.blu, opacity: 0.7 }, hovertemplate: "x̄ = %{x:.3f}<br>%{y} medie<extra></extra>" },
      { type: "scatter", mode: "lines", x: xg, y: xg.map(x => M * h.w * gauss(x, D.mu, st)),
        name: "gaussiana N(μ, σ²/n)", line: { color: C.arancio, width: 3 }, hoverinfo: "skip" },
    ], layoutBase({
      xaxis: asse("media campionaria x̄ di n campioni", { range: [xlo, xhi] }),
      yaxis: asse("numero di medie", { rangemode: "tozero" }),
      shapes: [lineaV(D.mu, C.grigio)],
      annotations: [{ x: D.mu, y: 1, xref: "x", yref: "y domain", text: " μ", showarrow: false, xanchor: "left",
        yanchor: "top", font: { color: C.grigio, size: 14 } }],
    }));
    lM(String(M)); lMu(num(D.mu, 3)); lSt(num(st, 4));
    lMm(M ? num(media(medie), 3) : "—"); lSm(M > 1 ? num(devStd(medie), 4) : "—");
  }
  return { sez, titolo: "Limite centrale", aggiorna, stato: () => ({ dist, n }),
    dati: "$\\bar x_n=\\frac{1}{n}\\sum_{i=1}^{n}x_i\\ \\longrightarrow\\ \\mathcal N\\!\\left(\\mu,\\ \\frac{\\sigma^2}{n}\\right)$",
    // preset per guida/stati: distribuzione, n, numero di medie (seme fisso)
    imposta(d, nn, M) { dist = d; n = nn; sDist.el.value = d; sN.set(nn); medie = []; rng = generatore(1); aggiungi(M); } };
})();

/* ================= MODO_MISURA: misure ripetute con incertezza ================= */
MODI.misura = (() => {
  const G = 9.81;                         // valore vero (m/s^2)
  let sigma = 0.15, z = [], rng = generatore(2);   // z: rumore normale standard, x_i = G + sigma*z_i
  const sez = sezione();
  Doll.titoletto(sez, "Parametri");
  const sS = Doll.slider(sez, { label: "rumore di una misura $\\sigma$", min: 0.05, max: 0.5, step: 0.01, value: sigma,
    fmt: v => num(v, 2) + " m/s²", onInput: v => { sigma = v; aggiorna(); } });
  Doll.bottone(sez, "+1", () => aggiungi(1));
  Doll.bottone(sez, "+10", () => aggiungi(10));
  Doll.bottone(sez, "+100 misure", () => aggiungi(100), true);
  Doll.bottone(sez, "Azzera", () => { z = []; rng = generatore(2); aggiorna(); });
  Doll.titoletto(sez, "Letture");
  const lN = Doll.lettura(sez, "misure $N$");
  const lM = Doll.lettura(sez, "media $\\bar x$");
  const lS = Doll.lettura(sez, "dev. std $s$");
  const lE = Doll.lettura(sez, "errore della media $s/\\sqrt{N}$");
  const lC = Doll.lettura(sez, "$|\\bar x-g|\\,/\\,(s/\\sqrt{N})$");
  const ris = document.createElement("div"); ris.className = "doll-risultato"; sez.appendChild(ris);
  nota(sez, "$s$ è la dispersione di una misura e non cala; l'errore della media sì.");

  function aggiungi(k) { for (let i = 0; i < k; i++) z.push(rng.n()); aggiorna(); }

  function aggiorna() {
    const x = z.map(v => G + sigma * v), N = x.length;
    // media progressiva e banda +- s_k/sqrt(k) (Welford, una passata)
    const kk = [], mk = [], su = [], giu = [];
    let m = 0, q = 0;
    x.forEach((v, i) => { const k = i + 1, d = v - m; m += d / k; q += d * (v - m);
      kk.push(k); mk.push(m);
      const e = k > 1 ? Math.sqrt(q / (k - 1) / k) : NaN; su.push(m + e); giu.push(m - e); });
    const xm = N ? m : NaN, s = devStd(x), e = s / Math.sqrt(N);
    const h = istogramma(x, G - 4 * sigma, G + 4 * sigma, 32);
    const xg = linspace(G - 4 * sigma, G + 4 * sigma, 300);
    const forme = [lineaV(G, C.grigio)];
    if (N > 1) forme.push({ type: "rect", xref: "x", yref: "y domain", x0: xm - e, x1: xm + e, y0: 0, y1: 1,
      fillcolor: C.verde, opacity: 0.18, line: { width: 0 } }, lineaV(xm, C.verde, "solid"));
    forme.push(lineaH(G, C.grigio, "dash", "x2", "y2"));
    disegna([
      { type: "bar", x: h.x, y: h.y, width: h.w * 0.95, name: "misure", marker: { color: C.blu, opacity: 0.7 },
        hovertemplate: "%{x:.3f} m/s²<br>%{y} misure<extra></extra>" },
      { type: "scatter", mode: "lines", x: xg, y: xg.map(v => N * h.w * gauss(v, G, sigma)), name: "attesa N(g, σ)",
        line: { color: C.arancio, width: 2.5 }, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", x: [NaN], y: [NaN], name: "x̄ ± s/√N", line: { color: C.verde, width: 8 },
        opacity: 0.35, hoverinfo: "skip" },   // voce di legenda per la banda verde
      // grafico in basso: media progressiva con la banda dell'errore
      { type: "scatter", mode: "lines", x: kk, y: giu, xaxis: "x2", yaxis: "y2", line: { width: 0 }, showlegend: false, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", x: kk, y: su, xaxis: "x2", yaxis: "y2", line: { width: 0 }, fill: "tonexty",
        fillcolor: "rgba(47,133,90,0.18)", showlegend: false, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", x: kk, y: mk, xaxis: "x2", yaxis: "y2", name: "media progressiva",
        line: { color: C.verde, width: 2 }, showlegend: false, hovertemplate: "N = %{x}<br>x̄ = %{y:.3f}<extra></extra>" },
    ], layoutBase({
      xaxis: asse("misura di g (m/s²)", { range: [G - 4 * sigma, G + 4 * sigma], anchor: "y" }),
      yaxis: asse("conteggi", { domain: [0.46, 1], rangemode: "tozero" }),
      xaxis2: asse("numero di misure N", { type: "log", anchor: "y2", range: [0, Math.log10(Math.max(N, 10)) + 0.02],
        tickvals: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000] }),
      yaxis2: asse("media x̄ (m/s²)", { domain: [0, 0.3], range: [G - 1.6 * sigma, G + 1.6 * sigma] }),
      shapes: forme,
      annotations: [{ x: G, y: 1, xref: "x", yref: "y domain", text: "g vero", showarrow: false, xanchor: "center",
        yanchor: "bottom", font: { color: C.grigio } }],   // sopra l'area del grafico, non sulle barre
    }));
    lN(String(N)); lM(N ? num(xm, 3) + " m/s²" : "—"); lS(N > 1 ? num(s, 3) + " m/s²" : "—");
    lE(N > 1 ? num(e, 3) + " m/s²" : "—"); lC(N > 1 ? num(Math.abs(xm - G) / e, 1) : "—");
    ris.innerHTML = N > 1 ? `g = ${conIncertezza(xm, e, "m/s²")}` : "servono almeno 2 misure";
  }
  return { sez, titolo: "Misure ripetute", aggiorna,
    dati: "$\\bar x\\pm\\frac{s}{\\sqrt N},\\qquad s^2=\\frac{1}{N-1}\\sum_{i=1}^{N}(x_i-\\bar x)^2$",
    imposta(sg, N) { sigma = sg; sS.set(sg); z = []; rng = generatore(2); aggiungi(N); } };
})();

/* ================= MODO_FIT: minimi quadrati con residui ================= */
// Fit di y = m x + q con incertezza uguale sigma_d su ogni y (formule di Taylor, "Introduzione all'analisi degli errori"):
//   D = N Sxx - Sx^2,  m = (N Sxy - Sx Sy)/D,  q = (Sxx Sy - Sx Sxy)/D,
//   sigma_m = sigma_d sqrt(N/D),  sigma_q = sigma_d sqrt(Sxx/D),  chi^2 = sum ((y - m x - q)/sigma_d)^2,  ndf = N - 2
function fitLineare(x, y, sd) {
  const N = x.length; let Sx = 0, Sy = 0, Sxx = 0, Sxy = 0;
  for (let i = 0; i < N; i++) { Sx += x[i]; Sy += y[i]; Sxx += x[i] * x[i]; Sxy += x[i] * y[i]; }
  const D = N * Sxx - Sx * Sx, m = (N * Sxy - Sx * Sy) / D, q = (Sxx * Sy - Sx * Sxy) / D;
  let chi2 = 0; for (let i = 0; i < N; i++) chi2 += ((y[i] - m * x[i] - q) / sd) ** 2;
  return { m, q, sm: sd * Math.sqrt(N / D), sq: sd * Math.sqrt(Sxx / D), chi2, ndf: N - 2 };
}
MODI.fit = (() => {
  const V = 2.0, S0 = 1.0, TMAX = 10;     // legge vera: s = 2,0 m/s * t + 1,0 m
  let N = 12, sigma = 0.5, fattore = 1, rng = generatore(3), z = [];
  const nuovi = () => { z = Array.from({ length: 40 }, () => rng.n()); };
  nuovi();
  const sez = sezione();
  Doll.titoletto(sez, "Parametri");
  const sN = Doll.slider(sez, { label: "punti $N$", min: 5, max: 40, step: 1, value: N, onInput: v => { N = v; aggiorna(); } });
  const sS = Doll.slider(sez, { label: "rumore vero $\\sigma$", min: 0.1, max: 2, step: 0.1, value: sigma,
    fmt: v => num(v, 1) + " m", onInput: v => { sigma = v; aggiorna(); } });
  const sB = Doll.scelta(sez, { label: "barre d'errore usate nel fit", value: "1",
    opzioni: [["1", "giuste: σ"], ["0.5", "sottostimate: σ/2"], ["2", "sovrastimate: 2σ"]],
    onChange: v => { fattore = +v; aggiorna(); } });
  Doll.bottone(sez, "Nuovi dati", () => { nuovi(); aggiorna(); }, true);
  Doll.titoletto(sez, "Letture");
  const lV = Doll.lettura(sez, "pendenza $v$");
  const lQ = Doll.lettura(sez, "intercetta $s_0$");
  const lC = Doll.lettura(sez, "$\\chi^2$");
  const lD = Doll.lettura(sez, "gradi di libertà $\\text{ndf}=N-2$");
  const lR = Doll.lettura(sez, "$\\chi^2/\\text{ndf}$");
  nota(sez, "Valori veri: $v = 2{,}0$ m/s, $s_0 = 1{,}0$ m. Con barre giuste $\\chi^2/\\text{ndf}\\approx 1$.");

  function aggiorna() {
    const t = Array.from({ length: N }, (_, i) => (i + 1) * TMAX / N);
    const s = t.map((ti, i) => V * ti + S0 + sigma * z[i]);
    const sd = fattore * sigma, f = fitLineare(t, s, sd);
    const res = s.map((si, i) => si - f.m * t[i] - f.q);
    const rmax = Math.max(3 * sd, ...res.map(r => Math.abs(r) + sd)) * 1.15;
    const err = { type: "data", array: t.map(() => sd), visible: true, color: C.blu, thickness: 1.5, width: 4 };
    disegna([
      { type: "scatter", mode: "lines", x: [0, TMAX], y: [S0, V * TMAX + S0], name: "legge vera",
        line: { color: C.grigio, width: 1.6, dash: "dash" }, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", x: [0, TMAX], y: [f.q, f.m * TMAX + f.q], name: "retta del fit",
        line: { color: C.arancio, width: 3 }, hoverinfo: "skip" },
      { type: "scatter", mode: "markers", x: t, y: s, name: "dati ± σ usata", error_y: err,
        marker: { color: C.blu, size: 7 }, hovertemplate: "t = %{x:.2f} s<br>s = %{y:.2f} m<extra></extra>" },
      { type: "scatter", mode: "markers", x: t, y: res, xaxis: "x2", yaxis: "y2", showlegend: false, error_y: err,
        marker: { color: C.blu, size: 6 }, hovertemplate: "residuo %{y:.2f} m<extra></extra>" },
    ], layoutBase({
      xaxis: asse("", { range: [0, TMAX + 0.4], anchor: "y", showticklabels: false }),
      yaxis: asse("posizione s (m)", { domain: [0.38, 1] }),
      xaxis2: asse("tempo t (s)", { range: [0, TMAX + 0.4], anchor: "y2", matches: "x" }),
      yaxis2: asse("residui (m)", { domain: [0, 0.27], range: [-rmax, rmax], zeroline: false }),
      shapes: [lineaH(0, C.arancio, "solid", "x2", "y2")],
    }));
    lV(conIncertezza(f.m, f.sm, "m/s")); lQ(conIncertezza(f.q, f.sq, "m"));
    lC(num(f.chi2, 1)); lD(String(f.ndf)); lR(num(f.chi2 / f.ndf, 2));
  }
  return { sez, titolo: "Fit lineare", aggiorna,
    dati: "$s=v\\,t+s_0,\\qquad \\chi^2=\\sum_{i}\\frac{(s_i-v\\,t_i-s_0)^2}{\\sigma^2}$",
    imposta(nn, sg, fa) { N = nn; sigma = sg; fattore = fa; sN.set(nn); sS.set(sg); sB.el.value = String(fa);
      rng = generatore(3); nuovi(); aggiorna(); } };
})();

/* ================= MODO_DECADIMENTO: Monte Carlo del decadimento radioattivo ================= */
// Ogni nucleo, a ogni passo Dt, decade con probabilita' p = lambda*Dt. Si sceglie Dt = 0,01/lambda
// (p = 0,01) cosi' l'errore di discretizzazione (1-p)^k vs e^(-lambda t) resta sotto il 3% fino a 6 tau.
// (Per un accordo esatto usa p = 1 - exp(-lambda*Dt).)
MODI.decadimento = (() => {
  const NN = [50, 100, 200, 500, 1000, 2000, 5000, 10000];
  const P = 0.01, PASSI = 600, RAGGR = 20;   // 600 passi = 6 tau; conteggi raggruppati ogni 20 passi (tau/5)
  let iN0 = 4, lambda = 0.2, logY = false, seme = 10, sim = null, anim = null;
  const sez = sezione();
  Doll.titoletto(sez, "Parametri");
  const sN0 = Doll.slider(sez, { label: "nuclei iniziali $N_0$", min: 0, max: NN.length - 1, step: 1, value: iN0,
    fmt: v => NN[v].toLocaleString("it-IT"), onInput: v => { iN0 = v; ricalcola(); } });
  const sL = Doll.slider(sez, { label: "costante di decadimento $\\lambda$", min: 0.05, max: 1, step: 0.05, value: lambda,
    fmt: v => num(v, 2) + " s⁻¹", onInput: v => { lambda = v; ricalcola(); } });
  const sScala = Doll.scelta(sez, { label: "scala verticale", value: "lin", opzioni: [["lin", "lineare"], ["log", "logaritmica"]],
    onChange: v => { logY = v === "log"; if (!anim) mostra(PASSI); } });
  Doll.bottone(sez, "▶ Esegui", () => esegui(), true);
  Doll.titoletto(sez, "Letture");
  const lTau = Doll.lettura(sez, "vita media $\\tau=1/\\lambda$");
  const lT = Doll.lettura(sez, "$t_{1/2}=\\ln 2/\\lambda$");
  const lTs = Doll.lettura(sez, "$t_{1/2}$ simulato");
  const lP = Doll.lettura(sez, "passo $\\Delta t$, $p=\\lambda\\Delta t$");
  const lC = Doll.lettura(sez, "1° intervallo $n\\pm\\sqrt{n}$");
  nota(sez, "Pochi nuclei: fluttuazioni grandi. Errore sui conteggi $\\sqrt{n}$ (Poisson).");

  function simula() {
    const rng = generatore(seme), N0 = NN[iN0], dt = P / lambda;
    const N = [N0];
    for (let k = 0; k < PASSI; k++) {
      let dec = 0; const n = N[k];
      for (let i = 0; i < n; i++) if (rng.u() < P) dec++;
      N.push(n - dec);
    }
    sim = { N0, dt, N, t: N.map((_, k) => k * dt) };
  }
  function ricalcola() { if (anim) { cancelAnimationFrame(anim); anim = null; } simula(); mostra(PASSI); }

  function mostra(kmax) {        // disegna la simulazione fino al passo kmax (animazione di "Esegui")
    const { N0, dt, N, t } = sim, Tc = RAGGR * dt, th = Math.LN2 / lambda;
    const tt = linspace(0, PASSI * dt, 300);
    // conteggi per intervallo: decadimenti fra i passi j*RAGGR e (j+1)*RAGGR
    const tc = [], n = [], atteso = [], tcAll = [];
    for (let j = 0; j < PASSI / RAGGR; j++) {
      const a = j * RAGGR, b = a + RAGGR, c = (a + RAGGR / 2) * dt;
      tcAll.push(c); atteso.push(N0 * (Math.exp(-lambda * a * dt) - Math.exp(-lambda * b * dt)));
      if (b <= kmax) { tc.push(c); n.push(N[a] - N[b]); }
    }
    // t1/2 dalla simulazione: primo passo con N <= N0/2, interpolato linearmente
    let ts = NaN;
    for (let k = 1; k <= kmax; k++) if (N[k] <= N0 / 2) { ts = t[k - 1] + (N[k - 1] - N0 / 2) / (N[k - 1] - N[k]) * dt; break; }
    const tracce = [
      { type: "scatter", mode: "lines", x: tt, y: tt.map(x => N0 * Math.exp(-lambda * x)), name: "N₀ e<sup>−λt</sup>",
        line: { color: C.arancio, width: 3 }, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", x: t.slice(0, kmax + 1), y: N.slice(0, kmax + 1), name: "Monte Carlo",
        line: { color: C.blu, width: 1.8, shape: "hv" }, hovertemplate: "t = %{x:.2f} s<br>N = %{y}<extra></extra>" },
      { type: "bar", x: tcAll, y: atteso, xaxis: "x2", yaxis: "y2", width: Tc * 0.9, name: "conteggi attesi",
        marker: { color: C.arancio, opacity: 0.28 }, hovertemplate: "attesi %{y:.1f}<extra></extra>" },
      { type: "scatter", mode: "markers", x: tc, y: n, xaxis: "x2", yaxis: "y2", name: "conteggi ± √n",
        marker: { color: C.blu, size: 6 }, error_y: { type: "data", array: n.map(Math.sqrt), visible: true, color: C.blu, thickness: 1.4, width: 3 },
        hovertemplate: "n = %{y}<extra></extra>" },
    ];
    const forme = [lineaH(N0 / 2, C.grigio, "dot"), lineaV(th, C.grigio, "dot")];
    const note = [{ x: th, y: 1, xref: "x", yref: "y domain", text: " t<sub>1/2</sub>", showarrow: false,
      xanchor: "left", yanchor: "top", font: { color: C.grigio, size: 14 } }];
    if (Number.isFinite(ts)) tracce.push({ type: "scatter", mode: "markers", x: [ts], y: [N0 / 2], name: "t<sub>1/2</sub> simulato",
      marker: { color: C.verde, size: 11, line: { color: "#fff", width: 2 } }, hovertemplate: "t½ = %{x:.2f} s<extra></extra>" });
    const tm = PASSI * dt;
    disegna(tracce, layoutBase({
      xaxis: asse("", { range: [0, tm], anchor: "y", showticklabels: false }),
      // in scala log: solo le decadi (dtick 1), altrimenti le etichette 2..9 si accavallano
      yaxis: asse("nuclei rimasti", logY ? { type: "log", dtick: 1, domain: [0.42, 1], range: [Math.log10(Math.max(0.8, N0 * Math.exp(-6.2))), Math.log10(N0 * 1.25)] }
                                          : { domain: [0.42, 1], range: [0, N0 * 1.05] }),
      xaxis2: asse("tempo t (s)", { range: [0, tm], anchor: "y2", matches: "x" }),
      yaxis2: asse("decadimenti", logY ? { type: "log", dtick: 1, domain: [0, 0.32], range: [Math.log10(0.3), Math.log10(atteso[0] * 2)] }
                                                     : { domain: [0, 0.32], rangemode: "tozero" }),
      bargap: 0, shapes: forme, annotations: note,
    }));
    lTau(num(1 / lambda, 2) + " s"); lT(num(th, 2) + " s");
    lTs(Number.isFinite(ts) ? num(ts, 2) + " s" : "—");
    lP(`${num(dt, 3)} s, ${num(P, 2)}`);
    lC(n.length ? `${n[0]} ± ${num(Math.sqrt(n[0]), 0)}` : "—");
  }
  function esegui() {            // nuova esecuzione (seme successivo) mostrata in ~1,5 s
    if (anim) cancelAnimationFrame(anim);
    seme++; simula();
    const t0 = performance.now();
    const passo = ts => { const k = Math.min(PASSI, Math.round((ts - t0) / 1500 * PASSI)); mostra(k);
      anim = k < PASSI ? requestAnimationFrame(passo) : null; };
    anim = requestAnimationFrame(passo);
  }
  return { sez, titolo: "Decadimento radioattivo", aggiorna: () => { if (!sim) simula(); mostra(PASSI); },
    dati: "$N(t)=N_0\\,e^{-\\lambda t},\\qquad t_{1/2}=\\frac{\\ln 2}{\\lambda},\\qquad p=\\lambda\\,\\Delta t$",
    lascia() { if (anim) { cancelAnimationFrame(anim); anim = null; } },
    imposta(i, l, scala) { iN0 = i; lambda = l; logY = scala === "log"; sN0.el.value = i; sL.el.value = l; sScala.el.value = scala;
      sN0.set(i); sL.set(l); seme = 10; ricalcola(); } };
})();

/* ================= cambio di modo ================= */
let modo = null;
function attiva(m) {
  if (modo && MODI[modo].lascia) MODI[modo].lascia();
  modo = m; sModo.el.value = m;
  for (const k in MODI) MODI[k].sez.hidden = k !== m;
  document.getElementById("titolo").textContent = MODI[m].titolo;
  const dati = document.getElementById("dati"); dati.innerHTML = MODI[m].dati; Doll.tex(dati);
  MODI[m].aggiorna();
}
attiva("tlc");

/* ================= percorso guidato + stati extra per il controllo ================= */
// "Prova tu": dimezzare la larghezza delle medie di n = 4 dadi. sigma_dado = sqrt(35/12) = 1,708 (NumPy):
// n = 4 -> sigma/sqrt(n) = 0,854; meta' = 0,427 = sigma/sqrt(16), quindi n = 16 (slider intero: esatto).
const prova = Doll.bersaglio(null, { testo: "Trova $n$ con larghezza $\\sigma/\\sqrt n$ metà di quella con $n=4$ (dado)",
  verifica: () => modo === "tlc" && MODI.tlc.stato().dist === "dado" && MODI.tlc.stato().n === 16,
  ok: "$n=16$: campioni $\\times 4$, larghezza $\\div 2$ ($0{,}854\\to 0{,}427$)" });
sModo.el.parentElement.after(prova.el);                // in cima al pannello, sotto "Esperimento"
const passo = (testo, f, conProva = false) => ({ testo, applica: () => { f(); prova.mostra(conProva); } });
const guida = Doll.guida([
  passo("Medie di $n=10$ dadi: l'istogramma diventa una gaussiana",
    () => { attiva("tlc"); MODI.tlc.imposta("dado", 10, 5000); }),
  passo("Da 10 a 1000 misure: cosa si stringe? Prevedi, poi Avanti",
    () => { attiva("misura"); MODI.misura.imposta(0.15, 10); }),
  passo("L'istogramma no ($s$ resta), la media sì: $s/\\sqrt N$ cala",
    () => { attiva("misura"); MODI.misura.imposta(0.15, 1000); }),
  passo("Minimi quadrati: residui casuali attorno a zero, $\\chi^2/\\text{ndf}\\approx 1$",
    () => { attiva("fit"); MODI.fit.imposta(12, 0.5, 1); }),
  passo("Ogni nucleo decade con probabilità $\\lambda\\Delta t$: emerge l'esponenziale",
    () => { attiva("decadimento"); MODI.decadimento.imposta(4, 0.2, "lin"); }),
  passo("Prova tu: dimezza la larghezza delle medie di $n=4$ dadi",
    () => { attiva("tlc"); MODI.tlc.imposta("dado", 4, 5000); }, true),
]);
// stati extra (solo per il controllo automatico): partono dal passo di guida dello stesso modo
Doll.stati([
  { nome: "TLC esponenziale n=1", applica: () => { guida.vai(0); MODI.tlc.imposta("esponenziale", 1, 5000); } },
  { nome: "TLC esponenziale n=30", applica: () => { guida.vai(0); MODI.tlc.imposta("esponenziale", 30, 5000); } },
  { nome: "misura N=100", applica: () => { guida.vai(2); MODI.misura.imposta(0.15, 100); } },
  { nome: "fit barre sottostimate", applica: () => { guida.vai(3); MODI.fit.imposta(20, 0.5, 0.5); } },
  { nome: "decadimento N0=100 log", applica: () => { guida.vai(4); MODI.decadimento.imposta(1, 0.2, "log"); } },
]);
Doll.pronto();
</script>
